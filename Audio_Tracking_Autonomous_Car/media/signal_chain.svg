<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 270" role="img" aria-label="Audio tracking car signal chain from sound source through filters and comparator ADC into Raspberry Pi motion control"><defs><style>.b{fill:#0b1729}.box{fill:#1b304c;stroke:#779cba;stroke-width:2}.teal{fill:#19434d;stroke:#42c9b9;stroke-width:2}.t{font:700 19px Arial,sans-serif;fill:#f2f8ff}.s{font:14px Arial,sans-serif;fill:#d7e8f4}.ln{fill:none;stroke:#a7e0e3;stroke-width:3;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="#a7e0e3"/></marker></defs><rect class="b" width="1280" height="270" rx="18"/><text x="36" y="42" class="t">Audio source → robot motion</text><rect class="box" x="36" y="85" width="200" height="100" rx="12"/><text class="t" x="136" y="124" text-anchor="middle">Microphone</text><text class="s" x="136" y="152" text-anchor="middle">Audio input</text><rect class="teal" x="288" y="85" width="200" height="100" rx="12"/><text class="t" x="388" y="124" text-anchor="middle">Band-pass filters</text><text class="s" x="388" y="152" text-anchor="middle">C6 / C8 targets</text><rect class="box" x="540" y="85" width="200" height="100" rx="12"/><text class="t" x="640" y="124" text-anchor="middle">Comparators</text><text class="s" x="640" y="152" text-anchor="middle">Digital GPIO levels</text><rect class="teal" x="792" y="85" width="200" height="100" rx="12"/><text class="t" x="892" y="124" text-anchor="middle">Raspberry Pi</text><text class="s" x="892" y="152" text-anchor="middle">Scan &amp; control</text><rect class="box" x="1044" y="85" width="200" height="100" rx="12"/><text class="t" x="1144" y="124" text-anchor="middle">DC motors</text><text class="s" x="1144" y="152" text-anchor="middle">H-bridge / motion</text><path class="ln" d="M236 135H288"/><path class="ln" d="M488 135H540"/><path class="ln" d="M740 135H792"/><path class="ln" d="M992 135H1044"/><text x="640" y="228" class="s" text-anchor="middle">Conceptual signal flow · detailed circuit values and pin assignments in the technical documentation</text></svg>