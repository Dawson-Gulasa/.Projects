<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Modular 32-bit SCC processor architecture showing instruction fetch, decode, execute, writeback, registers, memory, signed MUL/DIV and stack units"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e8eef7}.bg{fill:#101826}.block{fill:#1c2c42;stroke:#7394b5;stroke-width:1.3}.accent{fill:#1c4354;stroke:#54c8b6;stroke-width:1.3}.label{font-size:17px;font-weight:700}.sm{font-size:12px;fill:#b8cddd}.arrow{stroke:#9bd2e2;stroke-width:1.8;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#9bd2e2" stroke-width="1.2"/></marker></defs><rect class="bg" width="1000" height="520" rx="18"/><text x="42" y="42" class="label">SCC functional architecture</text><text x="42" y="66" class="sm">32-bit Verilog CPU · functional blocks, not a pipelined machine</text><rect class="block" x="38" y="120" width="166" height="94" rx="10"/><text class="label" x="121" y="154" text-anchor="middle">Fetch / PC</text><text class="sm" x="121" y="176" text-anchor="middle">IF + branch target</text><rect class="block" x="243" y="120" width="166" height="94" rx="10"/><text class="label" x="326" y="154" text-anchor="middle">Decode</text><text class="sm" x="326" y="176" text-anchor="middle">ID + branch control</text><rect class="accent" x="448" y="120" width="166" height="94" rx="10"/><text class="label" x="531" y="154" text-anchor="middle">Execute</text><text class="sm" x="531" y="176" text-anchor="middle">ALU + control</text><rect class="block" x="653" y="120" width="130" height="94" rx="10"/><text class="label" x="718" y="154" text-anchor="middle">Memory</text><text class="sm" x="718" y="176" text-anchor="middle">LOAD / STOR</text><rect class="block" x="822" y="120" width="140" height="94" rx="10"/><text class="label" x="892" y="154" text-anchor="middle">Writeback</text><text class="sm" x="892" y="176" text-anchor="middle">WB + flags</text><path class="arrow" d="M204 167 H242"/><path class="arrow" d="M409 167 H447"/><path class="arrow" d="M614 167 H652"/><path class="arrow" d="M783 167 H821"/><rect class="block" x="246" y="290" width="238" height="95" rx="9"/><text class="label" x="365" y="323" text-anchor="middle">Architectural registers</text><text class="sm" x="365" y="345" text-anchor="middle">R13 SP · R14=0 · R15=PC</text><path class="arrow" d="M325 215 V289"/><path class="arrow" d="M484 330 H530 V215"/><rect class="accent" x="555" y="290" width="198" height="95" rx="9"/><text class="label" x="654" y="323" text-anchor="middle">MUL / DIV</text><text class="sm" x="654" y="345" text-anchor="middle">microcode + datapaths</text><path class="arrow" d="M554 337 H535 V215"/><rect class="block" x="784" y="290" width="178" height="95" rx="9"/><text class="label" x="873" y="323" text-anchor="middle">PUSH / POP</text><text class="sm" x="873" y="345" text-anchor="middle">16-word stack</text><path class="arrow" d="M873 289 V215"/><rect x="38" y="420" width="924" height="56" rx="8" fill="#162238" stroke="#3b5069"/><text class="sm" x="500" y="441" text-anchor="middle">Ordinary instruction path + architectural writeback · instruction fetch stalls during multicycle MUL/DIV</text><text class="sm" x="500" y="460" text-anchor="middle">Simplified conceptual illustration; use docs/ARCHITECTURE.md and active RTL for signal-level detail</text></svg>