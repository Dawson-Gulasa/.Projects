<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-label="Signed multiplication and division microcode control, operand capture, datapaths, fetch stall and R12 writeback"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e8eef7}.bg{fill:#101826}.block{fill:#1c2c42;stroke:#7394b5;stroke-width:1.3}.accent{fill:#1c4354;stroke:#54c8b6;stroke-width:1.3}.label{font-size:17px;font-weight:700}.sm{font-size:12px;fill:#b8cddd}.arrow{stroke:#9bd2e2;stroke-width:1.8;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#9bd2e2" stroke-width="1.2"/></marker></defs><rect class="bg" width="960" height="450" rx="18"/><text x="35" y="42" class="label">Signed arithmetic: independent multicycle paths</text><rect class="block" x="360" y="70" width="240" height="60" rx="10"/><text x="480" y="94" class="label" text-anchor="middle">Instruction decode</text><text x="480" y="113" class="sm" text-anchor="middle">MUL / MULS or DIV / DIVS</text><path class="arrow" d="M420 130 V154 H250 V175"/><path class="arrow" d="M540 130 V154 H710 V175"/><rect class="accent" x="85" y="176" width="330" height="75" rx="10"/><text x="250" y="205" class="label" text-anchor="middle">MUL controller + ROM</text><text x="250" y="225" class="sm" text-anchor="middle">capture operands · sequence states</text><rect class="accent" x="545" y="176" width="330" height="75" rx="10"/><text x="710" y="205" class="label" text-anchor="middle">DIV controller + ROM</text><text x="710" y="225" class="sm" text-anchor="middle">capture operands · sequence states</text><rect class="block" x="85" y="272" width="330" height="66" rx="8"/><text x="250" y="299" class="label" text-anchor="middle">Signed MUL datapath</text><text x="250" y="319" class="sm" text-anchor="middle">64-bit product</text><rect class="block" x="545" y="272" width="330" height="66" rx="8"/><text x="710" y="299" class="label" text-anchor="middle">Signed DIV datapath</text><text x="710" y="319" class="sm" text-anchor="middle">quotient + remainder</text><path class="arrow" d="M250 251 V271"/><path class="arrow" d="M710 251 V271"/><path class="arrow" d="M250 338 V361 H480 V379"/><path class="arrow" d="M710 338 V361 H480"/><rect class="accent" x="336" y="380" width="288" height="45" rx="9"/><text x="480" y="400" class="label" text-anchor="middle">Writeback: Rd + R12</text><text x="480" y="416" class="sm" text-anchor="middle">Controlled register + flag updates</text><text x="480" y="149" class="sm" text-anchor="middle">Fetch stalls until execution completes</text></svg>